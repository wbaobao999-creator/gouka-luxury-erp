name: Verify ERP Simplification
on:
  push:
    branches: [simplify/erp-clear-actions-20261004]
    paths: [main.jsx, simplify.css, verification/**, .github/workflows/verify-simplification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund playwright @babel/parser
      - run: npx playwright install --with-deps chromium
      - run: node verification/simplify-workflows.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-workflow-screenshots
          path: verification/screenshots
