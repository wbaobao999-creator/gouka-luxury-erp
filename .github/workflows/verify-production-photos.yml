name: Verify Deployed ERP Photo Build
on:
  push:
    branches: [perf/photos-and-complete-cloud-read-20261004]
    paths: [verification/production-photo-smoke.mjs, .github/workflows/verify-production-photos.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: node verification/production-photo-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-production-photo-screenshots
          path: verification/screenshots
